          - generic [ref=f3e32]: 子平真诠评注序 子平真诠评注序 方重审序 命理乃吾国科学与哲学融贯而成一种学说，数千年来传衍嬗变，或隐或现，全赖一二有心人为之继续维系， 赖以不绝，其中确有学术上研究之价值，非徒痴人说梦，荒诞不经之谓也。其所以至今不能在科学中成立一 种地位者，实有数困。盖古代士大夫阶级目医卜星相为九流之学，多耻道之；而发明诸大师又故为惝恍迷离 之辞，以待后人探索；间有一二贤者有所发明，亦秘莫如深，既恐泄天地之秘，复恐讥为旁门左道，始终不 肯公开研究，成立一有系统说明之书籍，贻之后世。故居今日而欲研究此种学术，实一极困难之事。 按命理始于五星，一变而为子平；五星稍完备者，首推果老《星宗》全一书。然自民国以来，钦天监改为中 央观象台，七政四余台历以及量天尺，无人推算，此道根本无从着手，恐将日就淹灭。所余子平一派，尚有 线索可寻。此中旧籍，首推《滴天髓》与《子平真诠》二书，最为完备精审，后之言命学者，千言万语，不 能越其范围，如江河日月，不可废者。然古人著书，喜故为要渺之词，蹈玄秘之积习，后学之士，卒难了 解。《滴天髓》一书，幸有任铁樵注本，征引宏博，譬解详明，可谓斯道之龙象；而《子平真诠》，迄今无 人加以诠释。今徐子乐吾，既将任注《滴天髓》印行于前，复将《子平真诠》评注于后，可与任君先后比 美，使斯道得一详明而有系统之研究，将来在学术上之地位，植一基础，其功不在禹下矣。 后学者研究命学原理，得此二书，不致误入歧途。至于应用，仍有待乎多看古今命造，此所谓读书与实验二 者并重。至天分之高低，与所得之浅深，更互为因果。倘能合天才、学识、经验三者以俱全，于斯道庶几入 圣矣。此亦间世而后来，非朝夕所能遇也。 余谈命理有年，所愧三者均有不足，迄今鲜有发明。而乐吾朝夕寝馈于斯，矻矻忘年，时有述作。今书成将 付印行，不弃愚蒙，嘱为一言，爱略述所知，以发其端云。 丙子仲春桐城方重审序于海上小忘忧馆 徐乐吾自序 《子平真诠评注》竣，客有以袁了凡造命之说进者，曰：“命而可造，则命不足凭也。且子素习佛家言，如 云命定，则命优无妨作恶，命劣为善无益，有是理乎？夫命之优劣，孰造成之？孰主宰之？须知以宿世之善 因，而成今生之佳命，以宿世之恶因，而成今生之劣命。命运优劣，成于宿因，此为有定者也；今世之因， 今世即见其果，此命之无定者也。尝见有命优而运劣者，有命劣而运佳者；命如种子，运如开花之时节。命 优运劣，如奇葩卉，而不值花时，仅可培养于温室，而不为世重；若命劣运劣，则弱草轻尘，蹂躏道旁矣。 故命优而运劣者，大都安享有余，而不能有为于时，此宿因也；若不安于义命，勉强进取，则倾家荡产，声 名狼藉，此近因也。故命之所定，功名事业，水到渠成；否则，棘地荆天，劳而无功。至于成功失败之程 《》 度，则随其所造之因，有非命运所能推算者，或者循是因而成将来之果，定未来之命，则不可知矣。是因果 也，造命也，命理也，其理固相通者也。子曰‘君子居易以俟命’，又曰‘不知命无以为君子’。《子平真诠评 注》者，知命之入门方法，亦推求宿因之方便法门也。”客无言而退，因录之以为序。 民国二十五年二月东海乐吾氏识于海上寓次 《子平真诠》原序 予自束发就传，即喜读子史诸集，暇则子平《渊海》、《大全》略为流览，亦颇晓其意。然无师授，而于五 行生克之理，终若有所未得者。后复购得《三命通会》、《星学大成》诸书，悉心参究，昼夜思维，乃恍然 于命之不可不信，而知命之君子当有以顺受其正。 戊子岁予由副贡充补官学教习，馆舍在阜城门右，得交同里章公君安，欢若生平，相得无间，每值馆课暇， 即诣君安寓谈《三命》，彼此辩难，阐民无余蕴。已而三年期满，僦居宛平沈明府署，得山阴沈孝瞻先生所 著子平手录三十九篇，不觉爽然自失，悔前次之揣摩未至。遂携其书示君安，君安慨然叹曰：“此谈子平家 真诠也！” 先生讳燡燔，成乾隆己未进士，天资颖悟，学业渊邃，其于造化精微，固神而明之，变化从心者矣。观其论 用神之成败得失，又用神之因成得败、因败得成，用神之必兼看于忌神，与用神先后生克之别，并用神之透 与全、有情无情、无力无力之辨，疑似毫芒，至详且悉。是先生一生心血，生注于是，是安可以淹没哉！ 君安爰谋付剞劂，为天下谈命者，立至当不易之准，而一切影响游移管窥蠡测之智，俱可以不惑。此亦谈命 家之幸也；且不谈命家之幸，抑亦天下士君子之幸，何则？人能知命，则营竞之可以息，非分之想可以屏， 凡一切富贵穷通寿夭之遭，皆听之于天，而循循焉各安于义命，以共勉于圣贤之路，岂非士君子厚幸哉！ 观于此而君安之不没人善，公诸同好，其功不亦多乎哉？爱乐序其缘起。 乾隆四十一年岁丙申初夏同后学胡焜倬空甫谨识
