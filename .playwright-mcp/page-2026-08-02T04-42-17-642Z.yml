        - generic [ref=f11e25]: 题记与引 题记与引 渊海子平卷一 题记与引 题记 子平书，宋徐公东斋已详明矣。传有《渊海》、《渊源》之集，其理则一，篇句俱同。今之用者，惟宗《渊 海》。而《渊源》亦有妙用，或未之集。今将二书合并参考，遗失总归一轶。加之诗诀、起例，增解字义。 後学识之，则二书了然在目，无遗矣。谨白。 引 子平渊海之理，始自唐大夫李公虚中，以人生年月日时，生克旺相，休囚制化，决人生之祸福，其验神矣。 及公幕，昌黎韩炉为之作墓志，以记之後。经吕大夫才又裁定之，并无述作之者。至於有宋徐公升复以人生 日主分作六事，议论精微，作《渊海》之书，集话儒之义传布，至今悉皆宗之。後之诸君，文集渊源理义， 篇章雷同，迄今数百年矣。板籍有亥承鲁鱼之谬，学者少知其义。今唐君锦池礼请精通此理者，以二书并 之，增之口诀，正其讹僞矣。非悬壶化杖者，孰能更易。样行於世，神後学习之，不失古人之遗范矣。书 成，唐子示金书，以此为引。 崇领七年孟冬吉日重梓
