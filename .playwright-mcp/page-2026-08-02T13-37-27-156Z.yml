      - paragraph [ref=f22e22]: 以下是互联网版本的原文分段，仅作检索底本；规则进入 spec 前仍需回看 PDF 扫描页。
      - article [ref=f22e23]:
        - generic [ref=f22e24]: 原文 · 段 516 · 待校勘
        - generic [ref=f22e25]: 八字本有定理，理之不明，遂生异端，妄言妄听，牢不可破。如论干支，则不知阴阳之理，而以俗书体象歌 诀为确论；论格局，则不知专寻月令，而以拘泥外格为活变；论生克，则不察喜忌，而以伤旺扶弱为定法； 论行运，则不问同中有导，而以干支相类为一例。
      - article [ref=f22e26]:
        - generic [ref=f22e27]: 原文 · 段 519 · 待校勘
        - generic [ref=f22e28]: 究其缘由，一则书中用字轻重，不知其意，而谬生偏见；一则以鹆书无知妄作，误会其说，而深入迷途；一 则论命取运，偶然湊合，而遂以己见为不易，一则以古人命式，亦有误收，即收之不误，又以己意入外格， 尤为害人不浅。
      - article [ref=f22e29]:
        - generic [ref=f22e30]: 原文 · 段 522 · 待校勘
        - generic [ref=f22e31]: 如 壬申 癸丑 己丑 甲戌，本杂气财旺生官也，而以为乙亥时，作时上偏官论，岂知旺财生煞，将救死之不暇， 于何取贵？此类甚多，皆误收格局也。如 己未 壬申 戊子 庚申，本食神生财也，而欲弃月令，以为戊日庚申合禄之格，岂知本身自有财食，岂不甚 美？又何劳以庚合乙，求局外之官乎，此类甚多，皆硬入外格也。
      - article [ref=f22e32]:
        - generic [ref=f22e33]: 原文 · 段 525 · 待校勘
        - generic [ref=f22e34]: 人苟中无定见，察理不精，睹此谬论，岂能无惑？何况近日贵格不可解者，亦往往有之乎？岂知行术之人， 必以贵命为指归，或将风闻为实据，或探其生日，而即以己意加之生时，谬造贵格，其人之八字，时多未 确，即彼本身，亦不自知。若看命者不究其本，而徒以彼既富贵迁就其说以相从，无惑乎终身无解日矣！
