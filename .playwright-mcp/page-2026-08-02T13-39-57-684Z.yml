        - generic [ref=e177]: 福得十之二三而已又有合而無傷於合者何也如甲生寅卯月時 兩透辛官以年丙合月辛是爲合一留一官星反輕甲逢月刃庚辛 日逢壬是我之夫是我合之正是夫妻相親其情愈密惟壬在月上 並透丙與辛合是爲合官留煞而煞刃依然成格皆無傷干合也又 而年丁合之日干之丁反不能合是以已之夫被姊妹合去夫星透 作合是我之官是我合之何爲合去若庚在年上乙在月干則月上 作合惟是本身十干合之不爲合去假如乙用庚官日干之乙與庚 有合而不以合論者何也本身之合也六陽逢財六陰遇官俱是 而不透矣然又有爭合妬合之說何也如兩辛合丙兩丁合壬之類 之乙先去合庚而日干反不能合是爲合去也又如女以官爲夫丁 子平真詮 十