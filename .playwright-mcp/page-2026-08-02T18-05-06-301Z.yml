          - generic [ref=f69e29]: 卦辞：乾卦象征纯阳之德，具备四种品质：元（开创万物的源头之力），亨（畅通无阻的生长之势），利（各得其宜的和谐之道），贞（坚守正道的持久之性）。 六爻：初九，龙潜伏于深水之下，时机未到，不宜有所作为。九二，龙出现在田野之上，此时宜见有德之大人，共谋发展。九三，君子整日勤勉不懈，入夜仍保持警惕，虽处险境，终无过失。九四，龙或跃起、或退守深渊，随时审势，不会有过失。九五，龙飞腾于天际，正是宜见大人、君臣际会之时。上九，龙飞得过高而不知收敛，必有悔恨。用九，见到群龙皆不争首，是吉祥之兆。 彖传：乾元之德广大，是万物生长的根源，统摄天道运行。云气流行、雨水滋润，万物各具形态。太阳运行始终有序，六个爻位随时序而成，圣王乘此六龙之势以顺应天道。乾道不断变化，使万物各安其性命，保全大和之气，方能长久贞正。圣人领先于众物之上，天下万国因此安宁。 象传：天道运行刚健不息，君子应效法天道，自强不息，永不停歇。潜龙不用，是因阳气尚在下位；见龙在田，是德泽广布之时；终日乾乾，是反复践行正道；或跃在渊，是进退皆无过失；飞龙在天，是大人功业有成；亢龙有悔，是盛满之势不可长久；用九之德，是天德不以居首自矜。 文言传（节要）：元是善德之首，亨是嘉美之会聚，利是义理之调和，贞是事业之根干。君子以仁为本，可以领导他人；以礼聚会，可以合乎礼义；以义利物，可以调和各方；以贞固守，可以成就事业。 孔子解释各爻：潜龙，是有龙德而自隐之人，不随世俗改变，不求虚名，处隐而无烦闷，确乎不可动摇。见龙在田，是有龙德而居中正之人，言语守信，行为谨慎，防止邪念、存养诚心，德行广博而不自夸。 九三之人，重刚而位不得中，既不在天位，又不在田间，所以必须终日勤勉、时时警惕，虽危无咎。九四之人，或进或退，并非行邪，是君子把握时机、修德进业之举。 大人者，其德与天地相合，其明与日月同辉，其序与四时相应，其吉凶与鬼神相符。领先于天而天不违背，顺应于天而奉行天时。 上九亢龙之戒：只知进不知退，只知存不知亡，只知得不知失，必有悔恨。唯有圣人，知进退存亡而不失正道。
