    - generic [ref=f70e20]:
      - heading "原著正文 · 第 3 章 · 论十干十二支" [level=2] [ref=f70e21]
      - paragraph [ref=f70e22]: 以下是互联网版本的原文分段，仅作检索底本；规则进入 spec 前仍需回看 PDF 扫描页。可逐段展开下方现代翻译/释译，原注和评注仍单独折叠。
      - article [ref=f70e23]:
        - generic [ref=f70e24]: 原文 · 段 6 · 待校勘
        - generic [ref=f70e25]: 天地之间，一气而已。惟有动静，遂分阴阳。有老少，遂分四象。老者极动静之时，是为太阳太阴；少者初 动初静之际，是为少阴少阳。有是四象，而五行具于其中矣。水者，太阴也；火者，太阳也；木者，少阳 也；金者，少阴也；土者，阴阳老少、木火金水冲气所结也。
      - article [ref=f70e26]:
        - generic [ref=f70e27]: 原文 · 段 9 · 待校勘
        - generic [ref=f70e28]: 有是五行，何以又有十干十二支乎？盖有阴阳，因生五行，而五行之中，各有阴阳。即以木论，甲乙者，木 之阴阳也。甲者，乙之气；乙者，甲之质。在天为生气，而流行于万物者，甲也；在地为万物，而承兹生气 者，乙也。又细分之，生气之散布者，甲之甲，而生气之凝成者，甲之乙；万木之所以有枝叶者，乙之甲， 而万木之枝枝叶叶者，乙之乙也。方其为甲，而乙之气已备；及其为乙，而甲之质乃坚。有是甲乙，而木之 阴阳具矣。
      - article [ref=f70e29]:
        - generic [ref=f70e30]: 原文 · 段 11 · 待校勘
        - generic [ref=f70e31]: 何以复有寅卯者，又与甲乙分阴阳天地而言之者也。以甲乙而分阴阳，则甲为阳，乙为阴，木之行于天而为 阴阳者也。以寅卯而阴阳，则寅为阳，卯为阴，木之存乎地而为阴阳者也。以甲乙寅卯而统分阴阳，则甲乙 为阳寅卯为阴，木之在天成象而在地成形者也。甲乙行乎天，而寅卯受之；寅卯存乎地，而甲乙施焉。是故 甲乙如官长，寅卯如该管地方。甲禄于寅，乙禄于卯，如府官之在郡，县官之在邑，而各司一月之令也。
      - article [ref=f70e32]:
        - generic [ref=f70e33]: 原文 · 段 14 · 待校勘
        - generic [ref=f70e34]: 甲乙在天，故动而不居。建寅之月，岂必当甲？建卯之月，岂必当乙？寅卯在地，故止而不迁。甲虽递易， 月必建寅；乙虽递易，月必建卯。以气而论，甲旺于乙；以质而论，乙坚于甲。而俗书谬论，以甲为大林， 盛而宜斩，乙为微苗，脆而莫伤，可为不知阴阳之理者矣。以木类推，余者可知，惟土为木火金水冲气，故 寄旺于四时，而阴阳气质之理，亦同此论。欲学命者，必须先知干支之说，然后可以入门。
