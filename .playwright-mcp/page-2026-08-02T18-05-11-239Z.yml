        - generic [ref=f70e41]: 天地之间，本是一股浑然之气。这股气有动有静，由此分化出阴阳两面。阴阳各有老嫩之别——动静到极 致的状态，称为太阳与太阴；刚开始动与刚开始静的状态，称为少阳与少阴。由这四象进一步演化，五行 （金、木、水、火、土）便蕴含其中：水为太阴，火为太阳，木为少阳，金为少阴，土则由阴阳交冲汇聚 而成。 五行各自分阴阳，便生出十天干（甲乙丙丁戊己庚辛壬癸）。以木为例：甲是木气在天流行的阳面，是生 机散布的力量；乙是木气落于地的阴面，是万物承接生气、凝结成形的质料。甲如气之施予者，乙如质之 承受者。 天干与地支（子丑寅卯……至亥，共十二个）的关系，好比官员与辖地。天干是流行于天的气，动而不 定；地支是固定的时令之序，恒而不移。甲禄（旺盛寄托）于寅月，乙禄于卯月，犹如地方官员在其所辖 之地方可发号施令。 阳干性刚，即使力弱也不轻易顺从强势格局；阴干性柔，四柱（出生年月日时对应的八字组合）中财官偏 盛时便随势而从。这是阴阳天干在命局推演中最根本的性情差异。
