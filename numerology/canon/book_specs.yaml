# 各书现代规格（spec）：用今天的工程/理科语言说清每本书"是什么"。
# spec = 一句话；overview = 理科视角概览（书页展示，超长用 modal 看全文）。
# 定位是现代概括，帮助快速理解，不是证据；规则编码仍以原文引文为准（P2.5）。
# tier 含义见 docs/古籍数学化与计算流程方案.md：
#   T1 查表 / T2 谓词规则 / T3 参数型 / T4 意象型；文献层/理论层不参与命理计算。
specs:
  ziping_zhenquan:
    tier: T2
    input: 四柱（核心：日干×月令）
    output: 格局类型 + 成/败/救应判定
    spec: 月令定格的枚举分类器：四吉神顺用、四凶神逆用，成败是布尔条件链，"因成得败/因败得成"是 override 层。
    validation: 可直接验证（现有出生数据）；原著与徐注是两个不兼容流派，分开编码
    overview: |-
      把八字看成一个低维离散输入（8 个干支字符），沈孝瞻做的事相当于写了一份分类器规范：第一层用月令做主特征分裂，把命盘归入约十种"格局"；第二层检查支持与破坏条件（财生官、印护官、冲克、合去），输出成/败；第三层是异常处理——"因成得败、因败得成"本质上是对前两层结论的 override 规则。
      全书的可贵之处在于条理：条件和结论多为枚举值，比同时代著作更接近伪代码，是 T2 谓词规则的典型。需要注意徐乐吾的评注引入了完全不同的"能量平衡"算法（扶抑/病药/调候），与原著的格局分类不是同一个模型——本项目把两者拆成独立流派分别编码，避免源头污染。
  yuanhai_ziping:
    tier: T2+T4
    input: 四柱
    output: 十神/六亲/疾病等多域断语
    spec: 子平法奠基文集：十神与六亲的映射规则 + 大量条文和赋体，条文可谓词化，赋体挂起。
    validation: 条文部分可验证；赋体仅文献层
    overview: |-
      子平法的"1.0 规范"：它确立的最重要的东西是一次坐标系变换——把参照系从年柱（古法）换到日干，"我"由此有了固定原点，其余七个字的身份（官、财、印、食伤、比劫）全部变成相对日干的关系类型。这套"十神"类型系统是后世所有子平著作的公共基础。
      文本形态混杂：一部分是可以直接谓词化的条文（继善篇等），一部分是高度压缩的赋体口诀——后者类似只有助记口诀、没有展开公式的教科书摘要，无法直接编码，只能挂起或借助注家展开。
  sanming_tonghui:
    tier: T1+T2+T4
    input: 四柱、纳音、神煞
    output: 全领域断语（百科式）
    spec: 明代规则总汇：纳音/神煞是查表，格局论是谓词规则，内部各模块不保证一致——当规则候选库用，不当单一算法用。
    validation: 逐模块抽取验证；冲突模块作为不同流派并行
    overview: |-
      理解它的正确类比是"一个从未做过一致性检查的大型规则仓库"：万民英把明代以前的禄命材料几乎全部收编——纳音表、神煞表（查表层）、格局论（规则层）、六亲性情疾病（断语层）——但不同模块来自不同时代不同流派，互相冲突是常态而非例外。
      因此它的正确用法不是"实现三命通会算法"（不存在这样一个自洽算法），而是当**规则候选库**：逐模块抽取、标注来源、冲突规则作为并行流派各自验证。它同时是流派演变研究的最佳材料，因为它保存了大量被后世淘汰的规则。
  ditiansui:
    tier: T3+T4
    input: 四柱全局
    output: 气势/平衡评估 + 应事断语
    spec: 全局启发式评估器：旺衰、通关、从化看"势"，清浊真假看"质"；概念强但量化权重原文没给，须现代重构并登记参数。
    validation: 任氏命例可作回归测试集；重构参数须敏感性分析
    overview: |-
      与子平真诠的"规则枚举"路线相反，滴天髓走的是"局面评估"路线——类似棋类引擎的评估函数：不问命盘属于哪个格局，而是评估全局的力量对比（旺衰）、流通性（通关、源流）、纯度（清浊、真假）。一方独大且不可逆时改用"顺势"策略（从格、化格），相当于评估函数的分段定义。
      问题在于：这个评估函数的所有权重都是隐性经验，原文一个数值都没给。任何现代实现（比如给藏干、宫位、月令设权重算强度分）都是重构而非还原——所以它定级 T3：可以做，但参数必须作为超参数空间登记并做敏感性分析，不能调完参数后声称"这就是滴天髓原意"。任铁樵注中的大量命例是现成的回归测试集。
  ditiansui_yuanwen:
    tier: T4
    input: 四柱
    output: 纲领性口诀
    spec: 滴天髓原文口诀本（无任注）：纯纲领陈述，无操作化条件，用于与阐微本对照版本。
    validation: 仅版本对照，不单独编码
    overview: |-
      滴天髓的"裸内核"：只有刘基（托名）的原始口诀，没有任铁樵的展开注释。口诀本身是极高压缩率的纲领陈述（"欲识三元万法宗，先观帝载与神功"），信息密度类似论文摘要的摘要，不含任何可执行条件。
      收录它的价值在版本学：与阐微本逐句对照，能分清哪些内容是原文、哪些是任氏发挥——这直接决定规则的 text_layer 归属。
  qianli_minggao:
    tier: T2
    input: 四柱
    output: 判盘结论 + 带答案命例
    spec: 民国白话教材：标准判盘流程（定强弱→取用神→断六亲）+ 大量"命盘→作者断语"命例，是现成的引擎回归测试集。
    validation: 命例转 tests/canon_cases，检验引擎忠实性
    overview: |-
      韦千里用白话写的教材，对本项目的最大价值不是规则而是**标注数据**：书中大量命例都是（输入命盘 → 专家结论）的配对样本，相当于机器学习里的 golden set。把它们转成测试用例后，规则引擎的每次改动都能回归检验"是否还原了传统判法"。
      判盘流程本身（定旺衰→取用神→论六亲）是民国时期已经标准化的扶抑派流程，表述清晰，谓词化成本低。
  qiongtong_baojian:
    tier: T1
    input: 日干 × 月支
    output: 调候用神序列（有先后）
    spec: 120 格纯查表：每格一条"某月某干宜用某某"，是全库唯一可整书数学化的书。已实现为 qiongtong.yaml + 引擎。
    validation: 已跑通；待 120 条人工校勘定序
    overview: |-
      整本书就是一张 12×10 的查找表：行是月支（出生季节），列是日干，格值是推荐的"调候用神"及其优先序（如正月甲木→先丙后癸）。内在逻辑是气候平衡——冬生需火、夏生需水，本质上像恒温控制系统的设定点表。
      因为条件（月支×日干）和结论（天干枚举）都是有限离散值，它是全库唯一能**无损数学化**的书：没有模糊概念、没有隐藏参数。本项目已把 120 格全部抽取为带原文引文的规则文件并实现了查表引擎，是第一个跑通"古籍→特征列"完整链路的流派。
  shenfeng_tongkao:
    tier: T2
    input: 四柱
    output: 病（缺陷）与药（修正）配对
    spec: 病药模型：先用谓词检测命局缺陷（病），再检查是否存在对应修正项（药），病重药到为贵——一套"缺陷检测+补丁匹配"规则。
    validation: 可直接验证；张楠自注命例可作测试集
    overview: |-
      张楠的"病药说"用今天的话讲就是**缺陷检测＋补丁匹配**：先扫描命局找结构性缺陷（"病"——某种失衡或破坏项），再查盘中是否存在对应的修正元素（"药"）。最有意思的是它的核心论断："病重而得药，大富大贵之人"——有严重缺陷但被修复的系统，优于从无缺陷的系统。
      这个论断是个非平凡的可检验预测（它不是"平衡就好"的同义反复），而且与子平真诠的"救应"概念形成跨书印证。张楠自注的命例可作测试集。
  mingli_tanyuan:
    tier: T2
    input: 四柱
    output: 体系化判盘规则
    spec: 袁树珊的体系化教程：把散落各书的规则整编成有条理的判盘手册，表述规整，适合当谓词化的中间参照。
    validation: 可直接验证
    overview: |-
      袁树珊做的工作类似一篇高质量的**技术综述**：把散落在渊海、三命通会、神峰等书里的规则重新整编成有目录、有层次的手册，并给出处。表述规整、术语统一，作为谓词化时的"中间参照文献"非常好用——当两本古书表述含糊时，可查它的整编版定分支。
  lixuzhong_mingshu:
    tier: T1+T4
    input: 年柱为主 + 纳音
    output: 禄命断语
    spec: 子平法之前的古法：以年柱和纳音为主的查表体系，与日主派是不同范式——作为历史对照流派（gufa）编码。
    validation: 与子平法对照检验；赋体部分挂起
    overview: |-
      子平法之前的"旧版 API"：主键是年柱而非日干，核心特征是纳音（一个把 60 干支组合降维到 30 个类别的映射表）。唐代李虚中以此推命，比宋代徐子平的日主法早了一个范式。
      对本项目它是天然的**历史对照组**：同一批人用旧范式和新范式各算一遍，如果两套体系都声称有效但结论互相矛盾，这本身就是重要证据。赋体部分不可编码，查表部分（纳音）可直接数学化。
  wuxing_dayi:
    tier: 理论层
    spec: 隋代五行理论总集：生克、旺相休囚死的公理化整理，不含预测规则——是 tables 层（基础映射表）的文献依据。
    validation: 不单独验证；为基础表提供出处
    overview: |-
      萧吉整理的五行"标准库文档"：五行生克是一个 5 节点有向图上的两个关系环（相生环与相克环，几何上就是五角星结构），旺相休囚死是元素强度随季节的周期函数。全书是对这套公理系统的系统化整理与文献汇考，不含"某某命如何"的预测规则。
      本项目用它做 tables 层（生克表、旺衰表）的文献出处——基础映射表里每一条都能回溯到它，而不是"大家都这么说"。
  yuzhao_dingzhenjing:
    tier: T1+T4
    input: 纳音 + 神煞
    output: 六亲、疾厄断语
    spec: 古法经典：纳音神煞查表断六亲疾厄，条文短小，部分可直接谓词化。
    validation: 古法流派对照
    overview: |-
      古法（年柱纳音派）的实操经典：用纳音五行的生克配神煞查表，直接输出六亲、疾病、寿夭断语。条文短小直接（"某某见某某，主克父"），一部分可以直接谓词化，归入古法对照流派。
  wuxing_jingji:
    tier: T2+T4
    input: 四柱、纳音、神煞
    output: 宋代命理规则集
    spec: 宋代类书：保存子平法早期形态的规则汇编，是流派演变研究的关键史料，编码价值次于史料价值。
    validation: 与明清本对照，观察规则演变
    overview: |-
      规则库的"化石层"：廖中在南宋编成此书时，子平法还没有定型，古法与新法并存。它保存了大量后世被淘汰或改写的中间形态规则——类似软件考古里的旧版本源码，能回答"哪些规则是后人加的、哪些一开始就有"。
      编码优先级低于史料价值：主要用于与明清定本对照，观察规则演变路径，而不是直接当预测算法。
  xingping_huihai:
    tier: T2（需扩展 X）
    input: 七政四余星盘 + 四柱
    output: 星平合参断语
    spec: 星命与子平合参大全：需要真实天文星盘（行星黄道位置），排盘引擎须扩展天文历算后才能编码。
    validation: 独立工作包；暂不阻塞八字主线
    overview: |-
      "星平会海"的名字就是体系说明：星（七政四余，真实天文星盘）＋平（子平，历法干支）合参。它的输入比八字多一整套连续变量——行星黄道经度，这意味着排盘引擎必须接天文历算库（如瑞士星历表）才能复现它的 X。
      对项目的意义：七政四余与西方占星共享"真实天象"输入，未来可以做一个有趣的三方对照——同一批人的干支系统、中式星命、西式占星各自的预测力。目前列为独立工作包，不阻塞八字主线。
  bazi_tiyao:
    tier: T1+T2
    input: 日干 × 月令
    output: 提要式判盘要点
    spec: 韦千里按日干×月令组织的速查提要，结构接近穷通宝鉴的查表，可作调候表的旁证版本。
    validation: 与穷通宝鉴交叉校验
    overview: |-
      与穷通宝鉴同构的 10×12 速查手册：按日干×月令组织，每格给判盘要点。因为结构相同、作者不同、时代不同，它是穷通宝鉴 120 格查表的**独立旁证版本**——两表一致处可信度高，分歧处则是流派差异的直接证据，正好用于交叉校验。
  guigu_yiwen:
    tier: T4
    input: 纳音
    output: 赋体断语
    spec: 托名鬼谷子的古法赋文：意象化表述为主，少量可抽取条文。
    validation: 仅文献层为主
    overview: |-
      托名鬼谷子的古法赋文，以纳音意象为主（"甲子乙丑海中金"式的联想展开）。赋体的问题是只有结论意象、没有条件结构——类似只有口诀没有推导的笔记，无法直接编码，仅少量条文可抽取。定位为文献层。
  guagua_ji:
    tier: 命例集
    input: 四柱命例
    output: 作者断语
    spec: 民国命例集：主要价值是"命盘+断语"配对数据，转为引擎回归测试集。
    validation: 测试集用途
    overview: |-
      民国命例集：像千里命稿的命例部分一样，价值在于（命盘 → 专家断语）的配对样本。不从中抽规则，直接转成引擎的回归测试用例。
  mingli_yueyan:
    tier: T2
    input: 四柱
    output: 条文式规则
    spec: 陈素庵条文式规则集（论用神、论格局逐条陈述），全库最接近 if-then 的文本，谓词化成本最低。
    validation: 可直接验证；建议第二个编码
    overview: |-
      陈素庵以"删繁就简"为编辑原则写的条文式规则集——相当于对前代规则库做了一次**去重与规范化**：砍掉神煞和他认为无稽的杂说，把留下的规则写成"凡某某，必某某"的条文。全库最接近 if-then 的文本，谓词化成本最低。
      它的取舍本身也有信息量：陈素庵删掉的规则集合，正是"传统内部也认为不可靠"的部分，可作规则可信度的先验参考。建议作为穷通宝鉴之后第二个编码的书。
  zaohua_yuanyue:
    tier: T1
    input: 日干 × 月支
    output: 调候用神（详注版）
    spec: 徐乐吾对穷通宝鉴的逐条详注：与 qiongtong.yaml 同一张 120 格表的注释层，用于校勘定序时参考。
    validation: 作为穷通宝鉴校勘的辅助材料
    overview: |-
      穷通宝鉴那张 120 格查表的"注释层"：徐乐吾逐条展开每格的推理依据和例外情况。校勘 qiongtong.yaml 定用神先后序时，它是最直接的参考材料——原文含糊处看它的展开，但注意它是民国注家的理解，text_layer 归评注，不能当原文证据。
  ziping_guanjian:
    tier: T2
    input: 四柱
    output: 判盘笔记
    spec: 清代子平笔记：个人经验式规则，散但可谓词化。
    validation: 低优先
    overview: |-
      清代个人研习笔记：规则散、体系性弱，但表述具体，可谓词化。优先级低，作为主线流派编码完成后的补充材料。
  yuding_ziping:
    tier: T2
    input: 四柱
    output: 官修纲要
    spec: 康熙官修子平纲要；当前站点仅节选（约9页），需另寻全本后再编码。
    validation: 底本不全，暂缓
    overview: |-
      康熙朝官修的子平纲要，代表清代官方认可的"标准版"子平法。当前语料只有约 9 页节选，底本不全——编码暂缓，待找到全本（四库本）后再处理。官修文本的价值在于它是经过一轮官方审定的规则快照。
  xingming_zongkuo:
    tier: T2+T4（需扩展 X）
    input: 星盘 + 干支
    output: 星命纲要
    spec: 辽代星命纲要：需天文星盘，归星命工作包。
    validation: 独立工作包
    overview: |-
      辽代星命纲要，输入含真实天文星盘，与星平会海同属星命工作包：需扩展天文历算引擎后才能复现其 X，暂不阻塞八字主线。
  yuetan_fu:
    tier: T4
    input: 四柱
    output: 赋体口诀
    spec: 赋体口诀短篇：意象表述，无操作化条件。
    validation: 仅文献层
    overview: |-
      赋体短篇：全部是意象化口诀，无显式条件结构，不可直接编码。保留为文献层，供注家展开时引用。
  luoluzi_xiaoxifu:
    tier: T4
    input: 干支
    output: 总纲赋文
    spec: 珞琭子赋文：禄命法总纲，历代注家依附其上，本体不可直接编码。
    validation: 仅文献层；注本是真正的规则来源
    overview: |-
      禄命法的"宪法文本"：本体是高度抽象的赋文总纲，历代命理著作大量以给它作注的形式展开（类似经-传结构：正文极简，规则都在注里）。本体不可编码；如果要用，真正的规则来源是各家注本。
  xingming_juegulu:
    tier: T2+T4（需扩展 X）
    input: 星盘 + 干支
    output: 星命考据
    spec: 星命考据笔记：归星命工作包。
    validation: 独立工作包
    overview: |-
      星命体系的考据笔记：作者对星命诸说做辨伪与源流梳理，属于"文献批评"性质的著作而非规则手册。
      输入端依赖真实天文星盘，归星命工作包（需扩展天文历算引擎），暂不阻塞八字主线。
  lantai_miaoxuan:
    tier: T1+T4
    input: 四柱
    output: 奇格异局命名
    spec: 格局命名表：一批特殊格局的识别条件与名称，识别条件可查表化，吉凶断语多为赋体。
    validation: 格局识别可验证，断语层挂起
    overview: |-
      特殊格局的**模式识别目录**：每条是一个命盘 pattern 的识别条件＋名称＋吉凶断言（"六阴朝阳""金神格"之类）。识别条件多为精确的干支组合匹配，可查表化；但断语层多为赋体夸饰，需拆开处理——pattern 识别可验证（这些稀有格局的人群结局是否异于基线），断语挂起。
  yijing:
    tier: 文献层
    spec: 周易原典阅读语料；原文、翻译、解读和版本对照，不进入八字命理计算或出生档案统计。
    validation: 不参与命理验证
    overview: |-
      从符号系统看，六十四卦是一个 6 位二进制状态空间（2⁶=64，莱布尼茨 1703 年就注意到这个同构），卦爻辞是给每个状态及其六个分量写的注释文本。作为占卜系统使用时，蓍草起卦是一个概率并不均匀的随机数发生器（老阴/少阳/少阴/老阳的概率为 1/16、5/16、7/16、3/16），"解卦"则是查表加发挥。
      本库只收录它作为阅读语料：原文、译文、解读与版本对照。占卜有效性验证属于前瞻实验（P2）且与出生档案无关，周易不进入命理计算。
  yizhuan:
    tier: 理论层
    spec: 易经的哲学注释层（十翼），无预测规则。
    validation: 不验证
    overview: |-
      对易经符号系统的"元理论层"：十翼不增加新状态、不给预测规则，而是解释这套符号系统为什么有意义（彖、象、系辞是语义层，说卦是特征表，序卦杂卦是排序学）。纯阅读语料。
  dongpo_yizhuan:
    tier: 理论层
    spec: 苏轼的易经义理注释，文史价值为主。
    validation: 不验证
    overview: |-
      苏轼注易，义理派路线：不谈象数占验，把易经当哲学文本读。收录价值是文史阅读与义理派视角对照，不参与任何计算。
  huayan_t0279:
    tier: 文献层
    spec: 唐实叉难陀译《大方广佛华严经》（T0279）古籍阅读语料；只做原文、译文、解读和版本对照，不进入命理计算。
    validation: 不参与命理验证
    overview: |-
      华严经不是预测系统——它是佛教宇宙论的极大化文本，以"一即一切、一切即一"的全息式结构著称：因陀罗网的比喻（每颗宝珠映现其余一切宝珠）常被现代读者拿来类比递归、自相似与全息原理，法界缘起则是一套"万物互为条件"的关系本体论。
      本库收录八十卷本（实叉难陀译，大正藏 T0279）纯粹作为古籍阅读语料和文本处理流水线的对照样本：原文、释译、版本对照。它没有输入输出，不进入任何命理计算或统计。
