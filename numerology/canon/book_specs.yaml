# 各书现代规格（spec）：用现在的话说清每本书"是什么"。
# spec = 一句话；overview = 概览（书页展示，超长用 modal 看全文）。
# 定位是现代概括，帮助快速理解，不是证据；规则编码仍以原文引文为准（P2.5）。
# tier 含义见 docs/古籍数学化与计算流程方案.md：
#   T1 查表 / T2 谓词规则 / T3 参数型 / T4 意象型；文献层/理论层不参与命理计算。
specs:
  ziping_zhenquan:
    tier: T2
    input: 四柱（核心：日干×月令）
    output: 格局类型 + 成/败/救应判定
    spec: 以月令与日干定格局，四吉神顺用、四凶神逆用；成败由明确条件判定，"因成得败/因败得成"是最后一层修正。
    validation: 可直接验证（现有出生数据）；原著与徐注是两个不兼容流派，分开编码
    overview: |-
      全书围绕一个清晰的判断流程：先看月令与日干的关系确定格局，再看盘中其他字对格局是帮助还是破坏，得出成格或破格，最后处理特殊情况——破了有救、成了又被破。条件和结论大多写得明确，是最容易翻译成程序规则的一本书。
      需要注意：徐乐吾的评注走的是另一条路（看日主强弱、补偏救弊），和沈孝瞻原著的格局思路不是一回事。项目里把两者拆成独立流派分别编码，避免从源头混淆。
  yuanhai_ziping:
    tier: T2+T4
    input: 四柱
    output: 十神/六亲/疾病等多域断语
    spec: 子平法奠基文集：确立以日干为主的十神体系；条文部分可整理成规则，赋体部分只能作文献。
    validation: 条文部分可验证；赋体仅文献层
    overview: |-
      子平法的奠基文集。它确立了以日干代表命主本人这个基本设定，其余七个字与日干的关系（官、财、印、食伤、比劫）由此才有定义——后世所有八字书都建立在这套"十神"关系之上。
      书的内容一部分是表述明确的条文，可以整理成规则；另一部分是押韵的赋体口诀，只有结论没有条件，暂时只能作为文献保留，或借助注家的展开来处理。
  sanming_tonghui:
    tier: T1+T2+T4
    input: 四柱、纳音、神煞
    output: 全领域断语（百科式）
    spec: 明代规则总汇：纳音神煞是查表、格局论是条文，各模块并不一致——当规则候选库用，不当单一算法用。
    validation: 逐模块抽取验证；冲突模块作为不同流派并行
    overview: |-
      万民英把明代以前几乎所有命理材料汇编成的一部大书：纳音、神煞、格局、六亲、疾病无所不包。但各部分来自不同时代、不同流派，彼此矛盾的地方很多——它本身并不是一套自洽的算法。
      所以正确用法不是"实现三命通会"，而是把它当作规则的候选仓库：逐个模块抽取、标明出处，互相冲突的说法当作不同流派分别检验。它还保存了大量被后世淘汰的规则，是研究命理流派演变的重要材料。
  ditiansui:
    tier: T3+T4
    input: 四柱全局
    output: 气势/平衡评估 + 应事断语
    spec: 从全局气势与平衡看命的一派：概念影响深远，但没有量化标准，程序化必须自设权重并如实登记。
    validation: 任氏命例可作回归测试集；重构参数须敏感性分析
    overview: |-
      与子平真诠逐条列规则的写法不同，滴天髓谈的是对全局的整体判断：力量对比（旺衰）、五行是否流通（通关）、格局纯不纯（清浊真假），一方独大时则顺势而为（从格、化格）。
      它的概念体系影响很大，但全书没有给出量化标准——强到什么程度算强、清到什么程度算清，全凭经验。因此任何程序实现都要自己设定权重，这些权重必须当作研究假设明确登记、做敏感性分析，不能事后宣称"这就是原书的意思"。任铁樵注里的大量命例可以用来检验实现是否贴近传统判法。
  ditiansui_yuanwen:
    tier: T4
    input: 四柱
    output: 纲领性口诀
    spec: 滴天髓原文口诀本（无任注）：只讲纲领不讲操作，用于与阐微本对照版本。
    validation: 仅版本对照，不单独编码
    overview: |-
      滴天髓的原文口诀本，没有任铁樵的注释。口诀高度凝练，只讲纲领、不讲怎么操作。收录它主要为了和阐微本逐句对照，分清哪些话是原文、哪些是任氏的发挥——这直接影响每条规则该记在谁名下。
  qianli_minggao:
    tier: T2
    input: 四柱
    output: 判盘结论 + 带答案命例
    spec: 民国白话教材：判盘流程清楚，更重要的是附大量带结论的命例，是现成的引擎测试材料。
    validation: 命例转 tests/canon_cases，检验引擎忠实性
    overview: |-
      韦千里的白话命理教材，判盘流程（定强弱、取用神、断六亲）写得清楚，本身就容易整理成规则。
      对项目更有价值的是书里附的大量命例：每个命例都是"一个命盘配一个作者结论"的完整样本，正好拿来考规则引擎——引擎算出的结果和书里的结论对不上，要么是规则录错了，要么是原书自相矛盾，两种情况都值得记录下来。
  qiongtong_baojian:
    tier: T1
    input: 日干 × 月支
    output: 调候用神序列（有先后）
    spec: 120 格查表：每格一条"某月某干宜用某神"，条件结论全部明确，是唯一能完整程序化的书。已实现。
    validation: 已跑通；待 120 条人工校勘定序
    overview: |-
      全书的骨架就是一张 120 格的表：十二个月份对十个日干，每格给出这个组合最需要的"调候用神"和先后顺序（比如正月甲木先用丙、再用癸）。道理来自气候：冬天生的要火暖，夏天生的要水润。
      因为条件和结论都是明确的枚举，全书可以完整转成程序而不损失内容——这在所有命理古籍里是唯一的。项目已把 120 格全部提取成带原文出处的规则，并实现了查表引擎，是第一个跑通"古籍到特征"完整链路的流派。
  shenfeng_tongkao:
    tier: T2
    input: 四柱
    output: 病（缺陷）与药（修正）配对
    spec: 病药说：先找命局缺陷（病），再看有无修正（药）；"病重得药反而大贵"是可检验的具体主张。
    validation: 可直接验证；张楠自注命例可作测试集
    overview: |-
      张楠的核心主张是"病药说"：先找命局的毛病（病），再看盘中有没有解决它的字（药）。他有个很有意思的论断——"病重而得药"的命反而大富大贵：有严重缺陷但被修复，好过四平八稳。
      这个说法不是空话，而是一个可以检验的具体预测，并且与子平真诠的"救应"概念互相呼应。书里张楠自己注的命例也可以拿来做测试。
  mingli_tanyuan:
    tier: T2
    input: 四柱
    output: 体系化判盘规则
    spec: 袁树珊的体系化整编：把散落各书的规则编成有条目有出处的手册，录入规则时的好参照。
    validation: 可直接验证
    overview: |-
      袁树珊把散落在渊海、三命通会、神峰通考等书里的规则重新整编成有条目、有出处的手册，表述规整、术语统一。别的古书说得含糊时，可以查它的整理版帮助确定条件分支——做规则录入时非常好用的参照书。
  lixuzhong_mingshu:
    tier: T1+T4
    input: 年柱为主 + 纳音
    output: 禄命断语
    spec: 子平法之前的古法：以年柱和纳音为主，与日主派是两个体系，作历史对照流派编码。
    validation: 与子平法对照检验；赋体部分挂起
    overview: |-
      子平法出现之前的推命体系：以年柱为主、以纳音为主要工具，相传为唐代李虚中所用。它和后来以日干为主的子平法是两个不同的体系。
      对项目来说它是天然的历史对照组：同一批人用新旧两套方法各算一遍，如果都声称有效但结论互相矛盾，这本身就是有价值的证据。纳音部分是明确的查表，赋体部分无法编码。
  wuxing_dayi:
    tier: 理论层
    spec: 隋代五行理论总集：生克旺衰等基础概念的定义与汇考，不含预测规则，是基础表的文献出处。
    validation: 不单独验证；为基础表提供出处
    overview: |-
      萧吉对五行学说的系统整理：相生相克、旺相休囚死等基础概念的定义和文献汇考，不涉及个人命运预测。
      项目里把它当作基础对照表（生克表、旺衰表）的文献出处使用——基础表里的每一条都应该能追溯到具体文献，而不是"大家都这么说"。
  yuzhao_dingzhenjing:
    tier: T1+T4
    input: 纳音 + 神煞
    output: 六亲、疾厄断语
    spec: 古法经典：纳音配神煞查表，直接断六亲疾厄，条文短小，部分可整理成规则。
    validation: 古法流派对照
    overview: |-
      早期古法的实操书：用纳音配神煞查表，直接给出六亲、疾病、寿夭的断语。条文短小直接，一部分可以整理成规则，归入古法对照流派。
  wuxing_jingji:
    tier: T2+T4
    input: 四柱、纳音、神煞
    output: 宋代命理规则集
    spec: 南宋类书：保存子平法定型之前的早期规则，价值主要在与明清定本对照、看规则怎么演变。
    validation: 与明清本对照，观察规则演变
    overview: |-
      南宋廖中编的类书。成书时子平法尚未定型，新旧两派的说法并存，因此保存了大量后来被淘汰或改写的早期规则——想知道"哪些规则是后人加的、哪些一开始就有"，主要靠它。
      编码优先级不高，价值主要在与明清定本的对照。
  xingping_huihai:
    tier: T2（需扩展 X）
    input: 七政四余星盘 + 四柱
    output: 星平合参断语
    spec: 星（七政四余）与平（子平）合参的大全，需要真实天文星盘，待排盘引擎扩展后处理。
    validation: 独立工作包；暂不阻塞八字主线
    overview: |-
      书名就是体系：“星”指七政四余（按真实天象排的星盘），“平”指子平（历法干支），两套合起来参看。要复现它得先能计算行星位置，排盘引擎需要为此扩展，所以列为独立工作包，不影响八字主线。
      它和西方占星共用真实天象这一点，也给将来做中西体系对照留了可能。
  bazi_tiyao:
    tier: T1+T2
    input: 日干 × 月令
    output: 提要式判盘要点
    spec: 按日干×月令编排的速查手册，与穷通宝鉴结构相同，适合两表互相核对。
    validation: 与穷通宝鉴交叉校验
    overview: |-
      韦千里按"日干×月令"编排的速查手册，结构和穷通宝鉴一致，但成书更晚、作者不同。两张表说法一致的地方可信度更高；不一致的地方正是流派分歧的直接证据——拿来和穷通宝鉴互相核对非常合适。
  guigu_yiwen:
    tier: T4
    input: 纳音
    output: 赋体断语
    spec: 托名鬼谷子的古法赋文：基本只有断语没有条件，无法直接整理成规则。
    validation: 仅文献层为主
    overview: |-
      托名鬼谷子的古法赋文，以纳音意象为主。基本只有结论式的断语、没有明确条件，无法直接整理成规则，作为文献保留。
  guagua_ji:
    tier: 命例集
    input: 四柱命例
    output: 作者断语
    spec: 民国命例集："命盘配断语"的成对材料，转成引擎测试用例，不从中抽规则。
    validation: 测试集用途
    overview: |-
      民国的命例集，价值和千里命稿的命例部分相同：一个命盘配一个断语的成对材料，直接转成引擎的测试用例，不从中抽规则。
  mingli_yueyan:
    tier: T2
    input: 四柱
    output: 条文式规则
    spec: 陈素庵删繁就简的条文集："凡某某，必某某"式表述，最接近程序规则、录入成本最低。
    validation: 可直接验证；建议第二个编码
    overview: |-
      陈素庵编这本书的原则是删繁就简：神煞和他认为无稽的杂说一律砍掉，留下的规则写成"凡某某，必某某"的条文——是所有古籍里最接近程序规则的文本，录入成本最低。
      他删掉了什么本身也有信息：那正是传统内部也觉得不可靠的部分，可以作为规则可信度的参考。适合作为穷通宝鉴之后第二本编码的书。
  zaohua_yuanyue:
    tier: T1
    input: 日干 × 月支
    output: 调候用神（详注版）
    spec: 徐乐吾对穷通宝鉴的逐条详注：同一张 120 格表的说明书，校对用神先后时的直接参考。
    validation: 作为穷通宝鉴校勘的辅助材料
    overview: |-
      徐乐吾对穷通宝鉴逐条写的详注，相当于那张 120 格表的说明书：每格的道理、例外情况都有展开。校对穷通宝鉴的用神先后顺序时，它是最直接的参考。
      但要记住它是民国注家的理解，属于评注层，不能当作原文证据。
  ziping_guanjian:
    tier: T2
    input: 四柱
    output: 判盘笔记
    spec: 清代研习笔记：规则零散但表述具体，作为补充材料。
    validation: 低优先
    overview: |-
      清代人的研习笔记，规则零散、体系性不强，但表述具体、可以整理。主线流派做完后作为补充材料处理。
  yuding_ziping:
    tier: T2
    input: 四柱
    output: 官修纲要
    spec: 康熙官修子平纲要；当前语料仅约九页节选，找到全本后再编码。
    validation: 底本不全，暂缓
    overview: |-
      康熙朝官修的子平纲要，代表当时官方审定的"标准版"子平法。目前网上语料只有约九页节选，底本不全——先登记，等找到全本（如四库本）再处理。
  xingming_zongkuo:
    tier: T2+T4（需扩展 X）
    input: 星盘 + 干支
    output: 星命纲要
    spec: 辽代星命纲要：需要真实星盘作输入，归星命工作包。
    validation: 独立工作包
    overview: |-
      辽代的星命纲要，输入需要真实天文星盘，和星平会海一起归入星命工作包，等排盘引擎扩展天文计算后再处理。
  yuetan_fu:
    tier: T4
    input: 四柱
    output: 赋体口诀
    spec: 赋体短篇：全是意象化口诀，没有明确条件，无法编码。
    validation: 仅文献层
    overview: |-
      赋体短篇，全是意象化的口诀，没有明确的条件和结论结构，无法整理成规则。作为文献保留，供注家展开时引用。
  luoluzi_xiaoxifu:
    tier: T4
    input: 干支
    output: 总纲赋文
    spec: 禄命法早期纲领文献：正文只立总纲，规则都在历代注里，本体无法编码。
    validation: 仅文献层；注本是真正的规则来源
    overview: |-
      禄命法最早的纲领性文献之一，文字极简。历代命书大量以给它作注的方式展开——正文只立总纲，具体规则都在注里。所以本体没法编码；真正可用的规则要到各家注本里找。
  xingming_juegulu:
    tier: T2+T4（需扩展 X）
    input: 星盘 + 干支
    output: 星命考据
    spec: 星命诸说的考据笔记：辨伪和源流梳理为主，归星命工作包。
    validation: 独立工作包
    overview: |-
      对星命诸说做辨伪和源流梳理的考据笔记，性质更接近文献研究而不是规则手册。输入端依赖真实星盘，归入星命工作包，暂不处理。
  lantai_miaoxuan:
    tier: T1+T4
    input: 四柱
    output: 奇格异局命名
    spec: 特殊格局名录：识别条件（干支组合）明确可查表，吉凶断语多为赋体需另行处理。
    validation: 格局识别可验证，断语层挂起
    overview: |-
      一批特殊格局的名录：每条给出识别条件（特定的干支组合）、格局名称和吉凶断语。识别条件很明确，可以做成查表；断语则多是赋体的夸张说法。
      两部分要分开：格局识别本身可以检验——这些稀有组合的人，人生结局是否真的不同于常人；断语层暂不处理。
  yijing:
    tier: 文献层
    spec: 周易原典阅读语料；原文、翻译、解读和版本对照，不进入八字命理计算或出生档案统计。
    validation: 不参与命理验证
    overview: |-
      六十四卦在形式上是六个爻的排列组合（二的六次方），莱布尼茨当年就注意到它与二进制的对应。卦爻辞是给每一卦、每一爻配的文辞。作为占卜使用时，蓍草起卦是一个各结果概率并不均等的抽签过程，解卦则是查文辞再加发挥。
      本库只收录文本用于阅读：原文、译文、解读和版本对照。占卜是否灵验属于另行设计的前瞻实验，与出生资料无关——周易不进入命理计算。
  yizhuan:
    tier: 理论层
    spec: 易经的哲学注释层（十翼），无预测规则。
    validation: 不验证
    overview: |-
