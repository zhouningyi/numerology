# 濒死体验现象分类体系：大类 → NDERF 标准问卷问题的匹配规则。
# 分类依据是每篇案例自带的问卷答案（不是对叙述文本的关键词猜测）。
# question_contains 对问题文本做不区分大小写的包含匹配；
# 答案以 No/Uncertain/None 开头视为否定，其余视为阳性（answer_contains 可再收紧）。
categories:
  obe:
    name: 灵魂出体
    description: 感到离开身体、从体外观察（out-of-body experience）
    match:
      - question_contains: separated from your body
        positive_contains: [left my body, out of body, existed outside, "yes"]
  tunnel:
    name: 隧道
    description: 穿过隧道或类似通道
    match:
      - question_contains: through a tunnel
  bright_light:
    name: 强光/白光
    description: 看到或被明亮的光包围
    match:
      - question_contains: brilliant light
      - question_contains: unearthly light
  beings:
    name: 遇见存有
    description: 见到其他存有（不限于亲人或宗教形象）
    match:
      - question_contains: see any beings
      - question_contains: aware of any beings
  deceased:
    name: 已故亲友
    description: 遇到已经去世的亲人或朋友
    match:
      - question_contains: deceased
  religious_figure:
    name: 宗教/神圣形象
    description: 见到有形象的神、宗教人物、神圣存有或神秘临在
    match:
      - question_contains: religious spirits
      - question_contains: religious figure
      - question_contains: mystical being or presence
  god_awareness:
    name: 关于神的觉知
    description: 对神/至高存在的存在与否获得直接觉知
    match:
      - question_contains: god or a supreme being
  other_world:
    name: 另一个世界
    description: 进入非尘世的环境或世界
    match:
      - question_contains: enter another world
      - question_contains: unearthly world
  life_review:
    name: 生命回顾
    description: 重历或回看自己的人生片段
    match:
      - question_contains: review of past events
      - question_contains: life review
      - question_contains: scenes from the past
      - question_contains: scenes from your past
  boundary:
    name: 边界/不归点
    description: 到达边界或"过去就回不来"的临界点
    match:
      - question_contains: boundary
      - question_contains: point of no return
  time_distortion:
    name: 时间感改变
    description: 时间变快、变慢或失去意义
    match:
      - question_contains: time seem to speed
  heightened_senses:
    name: 感官增强
    description: 视觉、听觉等比平时清晰得多
    match:
      - question_contains: senses more vivid
  special_knowledge:
    name: 特殊知识/全知感
    description: 忽然理解一切或获得宇宙秩序的知识
    match:
      - question_contains: special knowledge
      - question_contains: understand everything
      - question_contains: purpose or coherence
  future_scenes:
    name: 未来景象
    description: 看到来自未来的场景
    match:
      - question_contains: scenes from the future
  distressing:
    name: 痛苦/负面体验
    description: 体验内容包含痛苦、恐惧或地狱式场景
    match:
      - question_contains: content of your experience
        positive_contains: [distressing, frightening, hellish]
  aftereffects_gifts:
    name: 后续特殊能力
    description: 体验后自述出现通灵、预感等特殊能力
    # 问卷问法随年代变化；阳性以 Yes / 明确获得能力为主，否定前缀由 classify 统一处理
    match:
      - question_contains: special gifts
        positive_contains: ["yes", "acquire", "acquired", "developed", "psychic", "ability", "abilities", "gift"]
      - question_contains: psychic, paranormal or other special
        positive_contains: ["yes", "acquire", "acquired", "developed", "psychic", "ability", "abilities", "gift"]
      - question_contains: special abilities
        positive_contains: ["yes", "acquire", "acquired", "developed", "psychic", "ability", "abilities", "gift"]

  # ── 以下从高频未映射问卷自动候选中人工确认纳入（仍只走问卷，不走正文关键词）──
  ineffable:
    name: 难以言表
    description: 体验难以用语言完整表达
    match:
      - question_contains: difficult to express in words
  peace:
    name: 平静/愉悦
    description: 体验中感到平静、安宁或愉悦
    match:
      - question_contains: feeling of peace or pleasantness
  joy:
    name: 喜悦
    description: 体验中感到喜悦
    match:
      - question_contains: feeling of joy
  harmony_unity:
    name: 和谐/与宇宙一体
    description: 感到与宇宙和谐或一体
    match:
      - question_contains: harmony or unity with the universe
  remote_awareness:
    name: 远程觉知
    description: 觉察到别处正在发生的事（如透视/遥视感）
    match:
      - question_contains: aware of things going on elsewhere
  thoughts_speeded:
    name: 思维加速
    description: 思维比平时快得多
    match:
      - question_contains: thoughts speeded up
  values_change:
    name: 价值观改变
    description: 体验后价值观或信念发生改变
    match:
      - question_contains: change in your values and beliefs
  relationships_change:
    name: 人际关系改变
    description: 体验后人际关系因体验而改变
    match:
      - question_contains: relationships changed specifically because
  info_love:
    name: 关于爱的信息
    description: 体验中获得关于爱的理解或信息
    match:
      - question_contains: gain information about love
  info_god:
    name: 关于神的信息
    description: 体验中获得关于神/存在的信息（与“觉知到神”可并存）
    match:
      - question_contains: gain information about the existence of god
  info_afterlife:
    name: 关于死后的信息
    description: 体验中获得关于死后世界/来生的信息
    match:
      - question_contains: gain information about an afterlife
  info_oneness:
    name: 关于一体/连接的信息
    description: 体验中获得关于万物连接或一体的信息
    match:
      - question_contains: gain information about universal connection or oneness
  info_meaning:
    name: 关于生命意义的信息
    description: 体验中获得关于生命意义的理解
    match:
      - question_contains: gain information about the meaning of life
  earthly_lives_meaningful:
    name: 尘世生活有意义（体验后）
    description: 体验后更相信尘世生活有意义与价值
    match:
      - question_contains: earthly lives are meaningful and significant after your experience
