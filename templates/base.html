<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>{% block title %}命理学统计研究{% endblock %}</title>
<script>
  // 提前应用主题，避免刷新时闪烁
  document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';
</script>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --text-muted: #8b949e; --accent: #58a6ff;
    --wood: #3fb950; --fire: #f85149; --earth: #d29922;
    --metal: #c9d1d9; --water: #58a6ff;
    --yang: #f0883e; --yin: #a371f7;
  }
  [data-theme="light"] {
    --bg: #f6f8fa; --surface: #ffffff; --border: #d0d7de;
    --text: #1f2328; --text-muted: #57606a; --accent: #0969da;
    --wood: #1a7f37; --fire: #cf222e; --earth: #9a6700;
    --metal: #57606a; --water: #0969da;
    --yang: #bc4c00; --yin: #8250df;
  }
  [data-theme="light"] dialog::backdrop { background: rgba(60, 70, 85, 0.45); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'SF Pro Text', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.6;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .container { max-width: 1320px; margin: 0 auto; padding: 0 14px; }

  nav {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 8px 0; margin-bottom: 14px;
  }
  nav .container { display: flex; align-items: center; gap: 24px; }
  nav .logo { font-size: 18px; font-weight: 600; color: var(--text); }
  nav a { color: var(--text-muted); font-size: 14px; }
  nav a:hover { color: var(--text); text-decoration: none; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 14px; margin-bottom: 10px;
  }
  .card h2 { font-size: 15px; margin-bottom: 8px; color: var(--text); }

  .grid { display: grid; gap: 16px; }
  .grid-2 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  @media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }

  .stat-num { font-size: 32px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 13px; color: var(--text-muted); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 6px 8px; color: var(--text-muted);
       border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  tr:hover { background: rgba(88,166,255,0.04); }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 12px; font-weight: 500;
  }
  .badge-wood { background: rgba(63,185,80,0.15); color: var(--wood); }
  .badge-fire { background: rgba(248,81,73,0.15); color: var(--fire); }
  .badge-earth { background: rgba(210,153,34,0.15); color: var(--earth); }
  .badge-metal { background: rgba(201,209,217,0.15); color: var(--metal); }
  .badge-water { background: rgba(88,166,255,0.15); color: var(--water); }
  .badge-yang { background: rgba(240,136,62,0.15); color: var(--yang); }
  .badge-yin { background: rgba(163,113,247,0.15); color: var(--yin); }
  .badge-aa { background: rgba(63,185,80,0.15); color: var(--wood); }
  .badge-a { background: rgba(88,166,255,0.15); color: var(--accent); }
  .badge-b { background: rgba(210,153,34,0.15); color: var(--earth); }
  .badge-c { background: rgba(248,81,73,0.15); color: var(--fire); }
  .badge-dd { background: rgba(201,209,217,0.1); color: var(--text-muted); }
  .badge-error { background: rgba(248,81,73,0.16); color: var(--fire); }
  .badge-warning { background: rgba(210,153,34,0.16); color: var(--earth); }
  .badge-info { background: rgba(88,166,255,0.16); color: var(--accent); }
  .muted { color: var(--text-muted); }
  .quality-details { max-width: 300px; overflow: hidden; text-overflow: ellipsis;
                     white-space: nowrap; color: var(--text-muted);
                     font: 11px/1.3 ui-monospace, SFMono-Regular, monospace; }
  .quality-page h1 { font-size: 22px; margin-bottom: 2px !important; }
  .quality-page .quality-meta { font-size: 12px; margin-bottom: 10px !important; }
  .quality-page .card { padding: 10px; }
  .quality-page .grid { gap: 10px; }
  .quality-page .filter-bar { gap: 7px; margin-bottom: 0; }
  .quality-page .filter-bar select, .quality-page .filter-bar button { padding: 4px 7px; font-size: 12px; }
  .quality-page .quality-summary { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  .quality-page .quality-summary table { font-size: 12px; }
  .quality-page .quality-table { font-size: 12px; }
  .quality-page .quality-table th, .quality-page .quality-table td { padding: 4px 6px; }
  .quality-page .quality-table th:nth-child(1) { width: 58px; }
  .quality-page .quality-table th:nth-child(2) { width: 180px; }
  .quality-page .quality-table th:nth-child(3) { width: 105px; }
  .quality-page .quality-table th:nth-child(5) { width: 300px; }
  @media (max-width: 900px) { .quality-page .quality-summary { grid-template-columns: 1fr; } }

  .pillar-box {
    display: inline-flex; flex-direction: column; align-items: center;
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 14px; margin: 4px; min-width: 60px; background: var(--surface);
  }
  .pillar-box .gan { font-size: 22px; font-weight: 600; }
  .pillar-box .zhi { font-size: 22px; font-weight: 600; }
  .pillar-box .label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .bar { height: 20px; border-radius: 4px; display: inline-block; min-width: 4px; }
  .bar-wood { background: var(--wood); }
  .bar-fire { background: var(--fire); }
  .bar-earth { background: var(--earth); }
  .bar-metal { background: var(--metal); }
  .bar-water { background: var(--water); }

  input, select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 14px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none;
    padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  button:hover { opacity: 0.9; }

  .pagination { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }
  .pagination a, .pagination span {
    padding: 6px 12px; border-radius: 6px; font-size: 14px;
    border: 1px solid var(--border);
  }
  .pagination .active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .filter-bar {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin-bottom: 16px;
  }

  /* 全局 reset 会清掉 dialog 的 margin:auto，这里恢复居中并统一遮罩 */
  dialog { margin: auto; }
  dialog::backdrop { background: rgba(1, 4, 9, 0.6); backdrop-filter: blur(2px); }

  /* 原文段悬停出译文（点击固定/取消固定） */
  .canon-seg .seg-trans {
    display: none; margin-top: 8px; padding: 8px 12px;
    border-left: 3px solid rgba(74, 163, 111, .5);
    background: rgba(74, 163, 111, .06); border-radius: 0 6px 6px 0;
  }
  .canon-seg:hover .seg-trans, .canon-seg.pinned .seg-trans { display: block; }
  .canon-seg.has-trans .canon-original { cursor: pointer; }
  .canon-seg .seg-trans-hint { font-size: 10px; opacity: .7; margin-left: 6px; }
  .canon-seg.pinned .seg-trans-hint { color: var(--wood); opacity: 1; }
  /* 《周易》按卦辞/爻辞逐条对照，译文不依赖 hover，默认始终显示。 */
  .canon-seg.yijing-seg .seg-trans { display: block; }

  /* 句级对照：悬停原文/译文任一句，两侧对应句同步高亮 */
  .sent-linked .sent { border-radius: 3px; padding: 1px 1px; cursor: default; }
  .sent-linked .sent.sent-hl {
    background: rgba(88, 166, 255, .20);
    box-shadow: 0 1px 0 rgba(88, 166, 255, .55);
  }
  /* 译本未覆盖的补译句：虚线下划线提示（悬停看说明） */
  .sent-linked .sent.sent-ai {
    border-bottom: 1px dashed rgba(210, 153, 34, .8);
  }
  .canon-seg.yijing-seg .canon-original { cursor: default; }
  /* 《华严经》按原文小段逐段对照，原文与译文默认同时展开。 */
  .canon-seg.huayan-seg .seg-trans { display: block; }
  .canon-seg.huayan-seg .canon-original { cursor: default; }

  /* [原文 | 中文] 切换 */
  .lang-tabs { display: inline-flex; border: 1px solid var(--border); border-radius: 6px;
               overflow: hidden; margin-bottom: 8px; }
  .lt-btn { background: var(--bg); color: var(--text-muted); border: none;
            padding: 3px 14px; font-size: 12px; cursor: pointer; border-radius: 0; }
  .lt-btn + .lt-btn { border-left: 1px solid var(--border); }
  .lt-btn.active { background: rgba(88,166,255,0.18); color: var(--accent); }

  /* 概念证据高亮（暗色主题下的柔和标记） */
  mark.ev-mark {
    background: rgba(210, 153, 34, 0.28); color: inherit;
    border-radius: 3px; padding: 0 2px;
    border-bottom: 1px solid rgba(210, 153, 34, 0.6);
  }
  /* 濒死体验概念证据：不同颜色只区分概念，不表示证据强弱。 */
  mark.ev-mark[data-color="violet"] { background: rgba(188, 140, 255, .28); border-color: #bc8cff; }
  mark.ev-mark[data-color="blue"] { background: rgba(88, 166, 255, .28); border-color: #58a6ff; }
  mark.ev-mark[data-color="teal"] { background: rgba(57, 211, 173, .26); border-color: #39d3ad; }
  mark.ev-mark[data-color="green"] { background: rgba(126, 231, 135, .26); border-color: #7ee787; }
  mark.ev-mark[data-color="indigo"] { background: rgba(129, 140, 248, .28); border-color: #818cf8; }
  mark.ev-mark[data-color="orange"] { background: rgba(247, 129, 102, .28); border-color: #f78166; }
  mark.ev-mark[data-color="yellow"] { background: rgba(210, 153, 34, .30); border-color: #d29922; }
  mark.ev-mark[data-color="purple"] { background: rgba(163, 113, 247, .28); border-color: #a371f7; }
  mark.ev-mark[data-color="pink"] { background: rgba(255, 123, 159, .27); border-color: #ff7b9f; }
  mark.ev-mark[data-color="red"] { background: rgba(248, 81, 73, .25); border-color: #f85149; }
  mark.ev-mark[data-color="cyan"] { background: rgba(121, 192, 255, .25); border-color: #79c0ff; }
  mark.ev-mark[data-color="lime"] { background: rgba(166, 227, 161, .26); border-color: #a6e3a1; }
  .nde-highlight-legend { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 12px; }
  .nde-highlight-chip { border:1px solid var(--border); border-radius:999px; padding:2px 8px; font-size:12px; }
  .nde-highlight-chip[data-color="violet"] { background:rgba(188,140,255,.28); border-color:#bc8cff; }
  .nde-highlight-chip[data-color="blue"] { background:rgba(88,166,255,.28); border-color:#58a6ff; }
  .nde-highlight-chip[data-color="teal"] { background:rgba(57,211,173,.26); border-color:#39d3ad; }
  .nde-highlight-chip[data-color="green"] { background:rgba(126,231,135,.26); border-color:#7ee787; }
  .nde-highlight-chip[data-color="indigo"] { background:rgba(129,140,248,.28); border-color:#818cf8; }
  .nde-highlight-chip[data-color="orange"] { background:rgba(247,129,102,.28); border-color:#f78166; }
  .nde-highlight-chip[data-color="yellow"] { background:rgba(210,153,34,.30); border-color:#d29922; }
  .nde-highlight-chip[data-color="purple"] { background:rgba(163,113,247,.28); border-color:#a371f7; }
  .nde-highlight-chip[data-color="pink"] { background:rgba(255,123,159,.27); border-color:#ff7b9f; }
  .nde-highlight-chip[data-color="red"] { background:rgba(248,81,73,.25); border-color:#f85149; }
  .nde-highlight-chip[data-color="cyan"] { background:rgba(121,192,255,.25); border-color:#79c0ff; }
  .nde-highlight-chip[data-color="lime"] { background:rgba(166,227,161,.26); border-color:#a6e3a1; }
  .nde-source-label { font-size:12px; color:var(--text-muted); margin:8px 0 4px; }
  /* 濒死体验专题页：顶部上下文固定，下方案例独立滚动。 */
  .nde-reader { height:calc(100vh - 78px); min-height:360px; display:flex; flex-direction:column; overflow:hidden; }
  .nde-reader-header { flex:0 0 auto; max-height:46vh; overflow-y:auto; padding:2px 6px 10px 0; border-bottom:1px solid var(--border); background:var(--bg); }
  .nde-reader-results { flex:1 1 auto; min-height:0; overflow-y:auto; padding:12px 6px 24px 0; overscroll-behavior:contain; }
  .nde-filter-label { font-size:12px; color:var(--text-muted); margin:8px 0 5px; }
  .nde-tag-groups { display:grid; gap:7px; }
  .nde-tag-group { display:flex; align-items:flex-start; gap:8px; }
  .nde-tag-group-title { flex:0 0 42px; padding:4px 7px; border:1px solid var(--accent); border-radius:6px; color:var(--accent); font-size:12px; font-weight:700; text-align:center; }
  .nde-tag-group .nde-filter-bar { flex:1 1 auto; }
  .nde-filter-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .nde-filter-chip { display:inline-flex; align-items:center; gap:4px; border:1px solid var(--border); border-radius:999px; padding:4px 9px; font-size:12px; color:var(--text); font-weight:600; text-decoration:none; transition:opacity .12s, background .12s; --chip-color:var(--border); }
  .nde-filter-chip:hover { text-decoration:none; filter:brightness(1.12); }
  .nde-filter-bar.has-selection .nde-filter-chip:not(.active) { opacity:.36; }
  .nde-filter-chip.active { background:transparent !important; color:var(--text); border-color:var(--chip-color); box-shadow:0 0 0 1px var(--chip-color), 0 0 11px var(--chip-color); opacity:1; transform:none; }
  .nde-filter-chip[data-color="violet"] { --chip-color:#bc8cff; background:rgba(188,140,255,.18); border-color:#bc8cff; }
  .nde-filter-chip[data-color="blue"] { --chip-color:#58a6ff; background:rgba(88,166,255,.18); border-color:#58a6ff; }
  .nde-filter-chip[data-color="teal"] { --chip-color:#39d3ad; background:rgba(57,211,173,.18); border-color:#39d3ad; }
  .nde-filter-chip[data-color="green"] { --chip-color:#7ee787; background:rgba(126,231,135,.18); border-color:#7ee787; }
  .nde-filter-chip[data-color="indigo"] { --chip-color:#818cf8; background:rgba(129,140,248,.18); border-color:#818cf8; }
  .nde-filter-chip[data-color="orange"] { --chip-color:#f78166; background:rgba(247,129,102,.18); border-color:#f78166; }
  .nde-filter-chip[data-color="yellow"] { --chip-color:#d29922; background:rgba(210,153,34,.18); border-color:#d29922; }
  .nde-filter-chip[data-color="purple"] { --chip-color:#a371f7; background:rgba(163,113,247,.18); border-color:#a371f7; }
  .nde-filter-chip[data-color="pink"] { --chip-color:#ff7b9f; background:rgba(255,123,159,.18); border-color:#ff7b9f; }
  .nde-filter-chip[data-color="red"] { --chip-color:#f85149; background:rgba(248,81,73,.18); border-color:#f85149; }
  .nde-filter-chip[data-color="cyan"] { --chip-color:#79c0ff; background:rgba(121,192,255,.18); border-color:#79c0ff; }
  .nde-filter-chip[data-color="lime"] { --chip-color:#a6e3a1; background:rgba(166,227,161,.18); border-color:#a6e3a1; }
  .nde-filter-chip[data-color="default"] { background:rgba(201,209,217,.12); }
  /* NDE 列表卡：只保留外层一个边框；标签折叠入口放在标题行。 */
  .nde-case-card { padding:12px 16px; }
  .nde-case-title-row { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-bottom:3px; }
  .nde-case-title-row > a { margin-right:2px; }
  .nde-case-tags { margin-left:auto; position:relative; }
  .nde-case-tags summary { cursor:pointer; list-style:none; color:var(--accent); font-size:12px; }
  .nde-case-tags summary::-webkit-details-marker { display:none; }
  .nde-case-tags-body { display:flex; flex-wrap:wrap; gap:5px; padding:7px 0 2px; width:100%; }
  .nde-case-meta { display:flex; flex-wrap:wrap; gap:5px 14px; color:var(--text-muted); font-size:12px; margin:3px 0 6px; }
  .nde-case-content { padding-top:2px; }
  .nde-advanced-bar { padding-bottom:2px; }
  .nde-advanced-chip { border-radius:6px; border-color:var(--accent); color:var(--accent); background:rgba(88,166,255,.08); }
  @media (max-width: 768px) {
    .nde-reader { height:calc(100vh - 70px); }
    .nde-reader-header { max-height:52vh; }
  }
</style>
<script>
  // 所有 dialog：点击遮罩（dialog 矩形之外）关闭
  document.addEventListener('click', (event) => {
    const dialog = event.target;
    if (!(dialog instanceof HTMLDialogElement) || !dialog.open) return;
    const rect = dialog.getBoundingClientRect();
    const inside = event.clientX >= rect.left && event.clientX <= rect.right
      && event.clientY >= rect.top && event.clientY <= rect.bottom;
    if (!inside) dialog.close();
  });

  // 亮/暗主题切换（localStorage 记忆）
  document.addEventListener('click', (event) => {
    if (event.target.id !== 'theme-toggle') return;
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('theme', next);
  });

  // 句级对照：悬停一句，同段内相同序号的原句/译句一起高亮
  document.addEventListener('mouseover', (event) => {
    const sent = event.target.closest('.sent-linked .sent');
    if (!sent) return;
    const article = sent.closest('.canon-seg');
    if (!article) return;
    article.querySelectorAll('.sent.sent-hl').forEach(s => s.classList.remove('sent-hl'));
    article.querySelectorAll(`.sent[data-si="${sent.dataset.si}"]`)
      .forEach(s => s.classList.add('sent-hl'));
  });
  document.addEventListener('mouseout', (event) => {
    const sent = event.target.closest('.sent-linked .sent');
    if (!sent) return;
    const article = sent.closest('.canon-seg');
    if (article && !article.contains(event.relatedTarget?.closest?.('.sent-linked .sent') || null)) {
      article.querySelectorAll('.sent.sent-hl').forEach(s => s.classList.remove('sent-hl'));
    }
  });

  // 原文段点击固定/取消固定译文（避免悬停移开就消失）
  document.addEventListener('click', (event) => {
    const original = event.target.closest('.canon-seg.has-trans:not(.yijing-seg):not(.huayan-seg) .canon-original');
    if (!original) return;
    if (window.getSelection && String(window.getSelection())) return;  // 选中文字时不切换
    original.closest('.canon-seg').classList.toggle('pinned');
  });

  // [原文 | 中文] 语言切换：作用于最近的 .lang-switch 容器，默认显示中文
  document.addEventListener('click', (event) => {
    const btn = event.target.closest('.lt-btn');
    if (!btn) return;
    const box = btn.closest('.lang-switch');
    if (!box) return;
    box.querySelectorAll('.lt-btn').forEach(b => b.classList.toggle('active', b === btn));
    box.querySelectorAll('.lang-pane').forEach(p => {
      p.hidden = p.dataset.lang !== btn.dataset.target;
    });
  });
</script>
<style>

  /* 顶部 Tab 使用局部切换；请求期间保留当前页面，避免点击后出现空白。 */
  body.nav-loading #page-content { opacity: .62; transition: opacity .12s ease; }
  .canon-fold { margin: 7px 0; border: 1px solid var(--border); border-radius: 6px; background: rgba(88,166,255,.03); }
  .canon-fold summary { cursor: pointer; padding: 6px 9px; color: var(--text-muted); font-size: 13px; }
  .canon-fold summary:hover { color: var(--text); }
  .canon-fold-body { padding: 7px 10px 10px; border-top: 1px solid var(--border); }
  .canon-original { padding: 5px 0; }
  .scan-compare-row { display: grid; grid-template-columns: 96px 1fr; gap: 9px; align-items: start; margin: 8px 0; }
  .scan-preview { max-width: 100%; max-height: 180px; object-fit: contain; cursor: zoom-in;
                 border: 1px solid var(--border); border-radius: 5px; background: #fff; }
  dialog.scan-modal { width: min(94vw, 1100px); max-width: none; max-height: 94vh; padding: 10px;
                      border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); }
  dialog.scan-modal::backdrop { background: rgba(0,0,0,.78); }
  .scan-modal img { display: block; max-width: 100%; max-height: 82vh; margin: 0 auto; object-fit: contain; background: #fff; }
  .scan-modal-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .scan-modal-close { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 3px 10px; }
  @media (max-width: 768px) { .scan-compare-row { grid-template-columns: 72px 1fr; } }
</style>
</head>
<body>
<nav>
  <div class="container">
    <span class="logo">玄学研究</span>
    <span class="muted" style="font-size:11px;letter-spacing:1px">玄学命理</span>
    <a href="/" data-fast-nav>概览</a>
    <a href="/persons" data-fast-nav>人物</a>
    <a href="/domains" data-fast-nav>预测域</a>
    <a href="/quality" data-fast-nav>质量</a>
    <a href="/canon" data-fast-nav>古籍</a>
    <a href="/docs" data-fast-nav>文档</a>
    <span style="border-left:1px solid var(--border);height:18px"></span>
    <span class="muted" style="font-size:11px;letter-spacing:1px">濒死探索</span>
    <a href="/nde" data-fast-nav>濒死探索</a>
    <button id="theme-toggle" type="button" title="切换亮/暗主题"
            style="margin-left:auto;background:transparent;border:1px solid var(--border);
                   color:var(--text-muted);padding:2px 10px;font-size:13px;border-radius:6px">◐</button>
  </div>
</nav>
<main id="page-content" class="container">
  {% block content %}{% endblock %}
</main>
<dialog id="scan-image-modal" class="scan-modal">
  <div class="scan-modal-bar">
    <span id="scan-image-caption">扫描页</span>
    <button type="button" class="scan-modal-close" id="scan-image-close">关闭</button>
  </div>
  <img id="scan-image-large" alt="放大扫描页">
</dialog>
<script>
(() => {
  const cache = new Map();
  const currentPath = () => window.location.pathname + window.location.search;

  async function fetchPage(url) {
    if (!cache.has(url)) {
      cache.set(url, fetch(url, {credentials: 'same-origin'}).then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.text();
      }));
    }
    return cache.get(url);
  }

  function updateNav(url) {
    document.querySelectorAll('nav a[data-fast-nav]').forEach((link) => {
      link.setAttribute('aria-current', link.getAttribute('href') === url ? 'page' : 'false');
    });
  }

  async function showPage(url, pushState) {
    document.body.classList.add('nav-loading');
    try {
      const html = await fetchPage(url);
      const parsed = new DOMParser().parseFromString(html, 'text/html');
      const next = parsed.querySelector('#page-content');
      if (!next) {
        window.location.href = url;
        return;
      }
      document.title = parsed.title;
      document.querySelector('#page-content').replaceWith(next);
      if (pushState) history.pushState({}, '', url);
      updateNav(url);
      window.scrollTo(0, 0);
    } catch (error) {
      window.location.href = url;
    } finally {
      document.body.classList.remove('nav-loading');
    }
  }

  // 标签：普通点击单选/再次点击取消；Ctrl/Command 点击在当前集合中切换标签。
  document.addEventListener('click', (event) => {
    const chip = event.target.closest('.nde-filter-chip[data-tag], .nde-filter-chip[data-facet]');
    if (!chip) return;
    event.preventDefault();
    const url = new URL(chip.href, window.location.href);
    const current = new URL(window.location.href).searchParams;
    const selected = [
      ...current.getAll('tag').map((value) => `tag:${value}`),
      ...current.getAll('facet').map((value) => `facet:${value}`),
    ];
    // 兼容旧的 concept 参数，但新链接统一写入 tag=concept:xxx。
    current.getAll('concept').forEach((key) => {
      if (!selected.includes(`tag:concept:${key}`)) selected.push(`tag:concept:${key}`);
    });
    const key = chip.dataset.tag ? `tag:${chip.dataset.tag}` : `facet:${chip.dataset.facet}`;
    const multi = event.ctrlKey || event.metaKey;
    if (multi) {
      const index = selected.indexOf(key);
      if (index >= 0) selected.splice(index, 1);
      else selected.push(key);
    } else if (selected.length === 1 && selected[0] === key) {
      selected.length = 0;
    } else {
      selected.splice(0, selected.length, key);
    }
    url.search = '';
    url.searchParams.delete('page');
    selected.forEach((item) => {
      const separator = item.indexOf(':');
      const kind = item.slice(0, separator);
      const value = item.slice(separator + 1);
      url.searchParams.append(kind, value);
    });
    window.location.href = url.pathname + url.search;
  });

  document.querySelectorAll('nav a[data-fast-nav]').forEach((link) => {
    link.addEventListener('mouseenter', () => { fetchPage(link.href).catch(() => {}); });
    link.addEventListener('focus', () => { fetchPage(link.href).catch(() => {}); });
    link.addEventListener('click', (event) => {
      if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      const url = new URL(link.href).pathname + new URL(link.href).search;
      if (url !== currentPath()) showPage(url, true);
    });
  });

  window.addEventListener('popstate', () => showPage(currentPath(), false));
  updateNav(currentPath());

  const modal = document.querySelector('#scan-image-modal');
  const largeImage = document.querySelector('#scan-image-large');
  const caption = document.querySelector('#scan-image-caption');
  const closeModal = () => { if (modal.open) modal.close(); };
  document.addEventListener('click', (event) => {
    const image = event.target.closest('.scan-preview');
    if (!image) return;
    largeImage.src = image.src;
    largeImage.alt = image.alt;
    caption.textContent = image.dataset.caption || image.alt || '扫描页';
    modal.showModal();
  });
  document.querySelector('#scan-image-close').addEventListener('click', closeModal);
  modal.addEventListener('click', (event) => { if (event.target === modal) closeModal(); });
})();
</script>
</body>
</html>
